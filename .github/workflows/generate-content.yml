name: Generate Charity Profile

on:
  schedule:
    # Run daily at 6:00 AM UTC (1:00 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for proper git operations

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON files
        run: npm run validate

      - name: Generate new article
        id: generate
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: npm run generate

      - name: Fix formatting inconsistencies
        run: |
          npm run fix-formatting
          node scripts/fix-horizontal-rules.js

      - name: Check for changes
        id: git-check
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- _guides/ generated-topics.json generation-failures.json assets/images/guides/)" ]]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push new article
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _guides/ generated-topics.json generation-failures.json assets/images/guides/
          git commit -m "Add sourced charity profile with image [automated]"
          git push

      - name: Add generation issues to workflow summary
        if: always()
        run: |
          node -e 'const fs=require("fs"); const file="generation-failures.json"; const failures=fs.existsSync(file)?JSON.parse(fs.readFileSync(file,"utf8")):[]; if(failures.length){fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## Article generation issues\n\n${failures.map(f=>`- **${f.title}**: ${f.error}`).join("\n")}\n`)}'

      - name: Fail workflow after recording generation issues
        if: steps.generate.outcome == 'failure'
        run: |
          echo "Article generation failed. Review generation-failures.json and the Generate new article log."
          exit 1
